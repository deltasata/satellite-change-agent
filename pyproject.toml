[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-agent"
version = "0.1.0"
description = "An agent for change detection in Sentinel-2 image time series, built three ways."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pystac-client>=0.8",
    "odc-stac>=0.3.10",
    "xarray>=2024.1",
    "numpy>=1.26",
    "dask>=2024.1",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pyarrow>=15",
    "pandas>=2.1",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "mcp>=2.3,<3",
    "claude-agent-sdk>=0.2",
    "langgraph>=1.0",
    "openai>=1.40",
    "onnxruntime>=1.18",   # runs the water networks (ONNX files) on the CPU; no PyTorch needed
    "planetary-computer>=1.0",   # signs the free Sentinel-1 radar links of Planetary Computer (B2)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# training only (milestone B1), installed in the separate environment .venv-ml:
ml = ["torch>=2.10", "terratorch", "segmentation-models-pytorch", "onnx", "onnxruntime"]

[tool.setuptools.packages.find]
include = ["core*", "mcp_server*", "agents*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access to the public STAC catalog (deselect with -m 'not network')",
]
